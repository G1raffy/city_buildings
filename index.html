<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>City Buildings</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0f172a;
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }

    .card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 14px;
      padding: 2rem;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.35);
      text-align: center;
    }

    h1 {
      font-size: 1.5rem;
      margin-bottom: 0.5rem;
    }

    p {
      color: #94a3b8;
      font-size: 0.95rem;
      margin-bottom: 1.25rem;
    }

    form {
      display: flex;
      gap: 0.5rem;
    }

    input[type="password"] {
      flex: 1;
      padding: 0.7rem 0.9rem;
      border-radius: 8px;
      border: 1px solid #475569;
      background: #0f172a;
      color: #f8fafc;
      font-size: 1rem;
      outline: none;
    }

    input[type="password"]:focus {
      border-color: #38bdf8;
    }

    button {
      padding: 0.7rem 1.1rem;
      border: none;
      border-radius: 8px;
      background: #38bdf8;
      color: #0f172a;
      font-weight: 600;
      font-size: 0.95rem;
      cursor: pointer;
    }

    button:hover {
      background: #7dd3fc;
    }

    .error {
      color: #f87171;
      font-size: 0.875rem;
      margin-top: 0.75rem;
      min-height: 1.25rem;
    }

    .hidden {
      display: none;
    }
  </style>
</head>
<body>
  <!-- Password Screen -->
  <section id="lock-screen" class="card">
    <h1>Enter Password</h1>
    <p>Enter the password to continue.</p>
    <form id="password-form">
      <input
        id="password-input"
        type="password"
        placeholder="Password"
        autocomplete="off"
        required
      />
      <button type="submit">Unlock</button>
    </form>
    <div id="error-msg" class="error" aria-live="polite"></div>
  </section>

  <!-- Main Screen -->
  <section id="building-screen" class="card hidden">
    <h1>make a building</h1>
    <button id="lock-btn" type="button" style="margin-top: 1.25rem;">Lock</button>
  </section>

  <script>
    const CORRECT_PASSWORD = "CityGameBuild123";

    const lockScreen = document.getElementById("lock-screen");
    const buildingScreen = document.getElementById("building-screen");
    const form = document.getElementById("password-form");
    const passwordInput = document.getElementById("password-input");
    const errorMsg = document.getElementById("error-msg");
    const lockBtn = document.getElementById("lock-btn");

    form.addEventListener("submit", (event) => {
      event.preventDefault();

      if (passwordInput.value === CORRECT_PASSWORD) {
        errorMsg.textContent = "";
        passwordInput.value = "";
        lockScreen.classList.add("hidden");
        buildingScreen.classList.remove("hidden");
      } else {
        errorMsg.textContent = "Incorrect password. Try again.";
        passwordInput.value = "";
        passwordInput.focus();
      }
    });

    lockBtn.addEventListener("click", () => {
      buildingScreen.classList.add("hidden");
      lockScreen.classList.remove("hidden");
      errorMsg.textContent = "";
      passwordInput.value = "";
      passwordInput.focus();
    });
  </script>
</body>
</html>
